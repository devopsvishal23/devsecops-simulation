# ============================================================
# Kubernetes Deployment — Secure version
# ============================================================
# SECURITY FIXES APPLIED IN SESSION 4:
# - Resource limits added (CPU and memory)
# - privileged: false (was true)
# - allowPrivilegeEscalation: false added
# - Secret removed from env var (Vault handles this in Session 7)
# - Service type changed from LoadBalancer to ClusterIP
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager
  namespace: default
  labels:
    app: taskmanager
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmanager
  template:
    metadata:
      labels:
        app: taskmanager
    spec:
      # Run as our non-root user (matches Dockerfile USER 1001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
      - name: taskmanager
        image: taskmanager:v2

        # FIXED: Resource limits prevent one container consuming all node resources
        # requests = guaranteed minimum allocation
        # limits = maximum allowed — container is killed if it exceeds this
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        ports:
        - containerPort: 5000

        # FIXED: Secure container settings
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        # FIXED: Secret removed from plain text env var
        # SECRET_KEY will be injected by Vault in Session 7
        # For now we reference a Kubernetes Secret (better than plain text)
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: secret-key

        # Health checks so Kubernetes knows when the app is ready
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: taskmanager-service
spec:
  selector:
    app: taskmanager
  ports:
  - port: 80
    targetPort: 5000
  # FIXED: ClusterIP instead of LoadBalancer
  # ClusterIP = internal only, not exposed to internet
  # Use an Ingress controller for controlled external access
  type: ClusterIP
