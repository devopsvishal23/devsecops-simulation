name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: taskmanager

jobs:

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run secret scan on application code
        run: |
          echo "=== Running detect-secrets on app code only ==="
          detect-secrets scan app/ requirements.txt > /tmp/scan-results.json
          cat /tmp/scan-results.json
          python3 -c "
          import json, sys
          with open('/tmp/scan-results.json') as f:
              data = json.load(f)
          results = data.get('results', {})
          if results:
              print('GATE FAILED: Secrets detected!')
              for fname, secrets in results.items():
                  for s in secrets:
                      print(f'  [{s[chr(116)+chr(121)+chr(112)+chr(101)]}] {fname}:{s[chr(108)+chr(105)+chr(110)+chr(101)+chr(95)+chr(110)+chr(117)+chr(109)+chr(98)+chr(101)+chr(114)]}')
              sys.exit(1)
          else:
              print('GATE PASSED: No secrets in application code')
          "

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          echo "=== Running Semgrep SAST ==="
          semgrep --config=auto app/ --json > semgrep-results.json || true
          python3 -c "
          import json, sys
          with open('semgrep-results.json') as f:
              data = json.load(f)
          findings = data.get('results', [])
          high = [f for f in findings if f.get('extra', {}).get('severity', '').upper() in ('ERROR', 'WARNING')]
          print(f'Total findings: {len(findings)}')
          print(f'High/Critical: {len(high)}')
          if high:
              print('GATE FAILED: High/Critical SAST findings found')
              for f in high:
                  print(f'  [{f[\"extra\"][\"severity\"]}] {f[\"check_id\"]} at {f[\"path\"]}:{f[\"start\"][\"line\"]}')
              sys.exit(1)
          else:
              print('GATE PASSED: No High/Critical SAST findings')
          "

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: semgrep-results.json

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit SCA
        run: |
          echo "=== Running pip-audit SCA ==="
          pip install -r requirements.txt -q
          pip-audit -r requirements.txt --format json --output pip-audit-results.json || true
          python3 -c "
          import json, sys, os
          if not os.path.exists('pip-audit-results.json'):
              print('GATE PASSED: No vulnerabilities found')
              sys.exit(0)
          with open('pip-audit-results.json') as f:
              data = json.load(f)
          vulns = []
          for dep in data.get('dependencies', []):
              for v in dep.get('vulns', []):
                  vulns.append(f\"{dep['name']} {dep['version']}: {v['id']}\")
          if vulns:
              print(f'GATE FAILED: {len(vulns)} vulnerabilities found')
              for v in vulns:
                  print(f'  {v}')
              sys.exit(1)
          else:
              print('GATE PASSED: No known vulnerabilities in dependencies')
          "

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results
          path: pip-audit-results.json

  build-and-scan:
    name: Build and Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "=== Building Docker image ==="
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker images | grep ${{ env.IMAGE_NAME }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Check Trivy gate
        run: |
          python3 -c "
          import json, sys, os
          if not os.path.exists('trivy-results.json'):
              print('GATE PASSED: No scan results')
              sys.exit(0)
          with open('trivy-results.json') as f:
              data = json.load(f)
          critical = []
          for result in data.get('Results', []):
              for v in result.get('Vulnerabilities', []):
                  if v.get('Severity') == 'CRITICAL' and v.get('FixedVersion'):
                      critical.append(f\"{v['PkgName']}: {v['VulnerabilityID']}\")
          if critical:
              print(f'GATE FAILED: {len(critical)} CRITICAL CVEs with fixes available')
              for c in critical:
                  print(f'  {c}')
              sys.exit(1)
          else:
              print('GATE PASSED: No CRITICAL CVEs with available fixes')
          "

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.json

      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  iac-scan:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          echo "=== Running Checkov IaC Scan ==="
          checkov -f infrastructure/deployment.yaml --framework kubernetes --soft-fail || true
          checkov -f Dockerfile --framework dockerfile --soft-fail || true
          echo "IaC scan completed - review results above"

  dast:
    name: DAST - ZAP Baseline
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start application
        run: |
          pip install flask==3.1.3 flask-cors==6.0.0 requests==2.33.0 flask-limiter==3.5.0 -q
          python app/app.py &
          sleep 5
          curl -f http://localhost:5000/health && echo "App is running"

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          cmd_options: '-I'
        continue-on-error: true

  sign-image:
    name: Sign Image - Cosign
    runs-on: ubuntu-latest
    needs: [build-and-scan, iac-scan, dast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load and sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          docker load < image.tar.gz
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > /tmp/cosign.key
          cat > attestation.json << ATTEST
          {
            "image": "${{ env.IMAGE_NAME }}:${{ github.sha }}",
            "git_sha": "${{ github.sha }}",
            "signed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "all_gates_passed": true
          }
          ATTEST
          cosign sign-blob --key /tmp/cosign.key --bundle attestation.bundle attestation.json
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > /tmp/cosign.pub
          cosign verify-blob --key /tmp/cosign.pub --bundle attestation.bundle attestation.json
          echo "Image signed and verified successfully"

  security-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, build-and-scan, iac-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## DevSecOps Security Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | detect-secrets | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | Semgrep | ${{ needs.sast.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | pip-audit | ${{ needs.sca.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Scan | Trivy | ${{ needs.build-and-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Scan | Checkov | ${{ needs.iac-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
